      <stop offset="0" stop-color="#012b3a"/>
      <stop offset="0.6" stop-color="#024d63"/>
      <stop offset="1" stop-color="#0a7d8c"/>
    </linearGradient>
    <radialGradient id="fLight" cx="0.7" cy="-0.1" r="0.9">
      <stop offset="0" stop-color="#7df0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7df0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="300" fill="url(#fBg)"/>
